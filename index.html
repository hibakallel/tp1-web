<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rent - Location de voitures</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css" />
</head>

<body>
    <header>
        <h1>AUTO RENT</h1>
        <p>Agence de location de voitures</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="#catalogue">Catalogue</a>
        <a href="#reservation">Réservation</a>
        <a href="contact.html">Contact</a>
        <a href="devis.html">Dernier Devis</a>
    </nav>

    <main>
        <section id="catalogue">
            <h2>Catalogue des véhicules (Données CSV)</h2>
            <table id="catalogueTable" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>Catégorie</th>
                        <th>Véhicule</th>
                        <th>Puissance</th>
                        <th>Prix / jour</th>
                        <th>État</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Généré automatiquement par script.js -->
                </tbody>
            </table>
        </section>

        <section id="reservation">
            <h2>Réservation</h2>
            <form id="reservationForm">
                <div>
                    <label for="nom">Nom et prénom :</label>
                    <input type="text" id="nom">
                </div>

                <div>
                    <label for="email">Email :</label>
                    <input type="email" id="email">
                </div>

                <div>
                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone">
                </div>

                <div>
                    <label for="categorie">Catégorie :</label>
                    <select id="categorie" style="width: 100%;">
                        <option value="">-- Sélectionner --</option>
                        <option value="Citadine">Citadine</option>
                        <option value="Berline">Berline</option>
                        <option value="Commerciale">Commerciale</option>
                    </select>
                </div>

                <div>
                    <label for="voiture">Voiture :</label>
                    <select id="voiture" style="width: 100%;">
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>

                <div>
                    <label for="dateDebut">Date de début :</label>
                    <input type="date" id="dateDebut">
                </div>

                <div>
                    <label for="dateFin">Date de fin :</label>
                    <input type="date" id="dateFin">
                </div>

                <div>
                    <label for="prixTotal">Prix estimé :</label>
                    <input type="text" id="prixTotal" readonly>
                </div>

                <div>
                    <button type="submit">Générer le devis</button>
                </div>

                <p id="message"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Auto Rent - Agence de location de voitures</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
